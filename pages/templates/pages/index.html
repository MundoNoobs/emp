{% extends 'pages/base.html' %}

{% block content %}
<!-- CONTENIDO PRINCIPAL DE LA PÁGINA -->
<div class="main-container">
    <h1>Bienvenido a nuestro E-commerce</h1>
    <p>Encuentra los mejores productos o crea tu propia tienda.</p>
    
    <!-- Botón que activa el modal flotante -->
    <button class="btn btn-primary" onclick="abrirModal()">Iniciar Sesión / Registrarse</button>
</div>


<!-- ========================================== -->
<!-- MODAL FLOTANTE (Oculto por defecto)        -->
<!-- ========================================== -->
<div id="modalAuth" class="modal" style="display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.5); z-index: 1000;">
    
    <div class="modal-content" style="background: white; width: 400px; margin: 10% auto; padding: 20px; border-radius: 8px; position: relative;">
        <!-- Botón para cerrar el modal -->
        <span onclick="cerrarModal()" style="position: absolute; right: 20px; top: 15px; cursor: pointer; font-size: 20px;">&times;</span>
        
        <!-- Pestañas de navegación interna del modal -->
        <div class="modal-tabs" style="display: flex; justify-content: space-between; margin-bottom: 20px;">
            <button onclick="cambiarPestana('login')" style="flex: 1; padding: 10px;">Iniciar Sesión</button>
            <button onclick="cambiarPestana('registro')" style="flex: 1; padding: 10px;">Registrarse</button>
        </div>

        <!-- 1. FORMULARIO DE INICIO DE SESIÓN -->
        <div id="vista-login">
            <h3 style="text-align: center;">Acceder</h3>
            
            <form method="POST" action="{% url 'index' %}">
                {% csrf_token %}
                <!-- Identificador de la acción para el views.py -->
                <input type="hidden" name="accion" value="login">
                
                <div style="margin-bottom: 15px;">
                    <input type="text" name="username" placeholder="Nombre de usuario" required style="width: 100%; padding: 8px;">
                </div>
                
                <div style="margin-bottom: 15px;">
                    <input type="password" name="password" placeholder="Contraseña" required style="width: 100%; padding: 8px;">
                </div>
                
                <button type="submit" style="width: 100%; padding: 10px; background-color: #007bff; color: white; border: none; cursor: pointer;">Entrar</button>
            </form>
        </div>

        <!-- 2. FORMULARIO DE REGISTRO -->
        <div id="vista-registro" style="display: none;">
            <h3 style="text-align: center;">Crear Nueva Cuenta</h3>
            
            <form method="POST" action="{% url 'index' %}">
                {% csrf_token %}
                <!-- Identificador de la acción para el views.py -->
                <input type="hidden" name="accion" value="registro">
                
                <div style="margin-bottom: 15px;">
                    <input type="text" name="username" placeholder="Nombre de usuario (Único)" required style="width: 100%; padding: 8px;">
                </div>
                
                <div style="margin-bottom: 15px;">
                    <input type="email" name="email" placeholder="Correo electrónico" required style="width: 100%; padding: 8px;">
                </div>
                
                <div style="margin-bottom: 15px;">
                    <input type="password" name="password" placeholder="Contraseña" required style="width: 100%; padding: 8px;">
                </div>
                
                <div style="margin-bottom: 15px;">
                    <input type="password" name="confirmar_password" placeholder="Confirmar Contraseña" required style="width: 100%; padding: 8px;">
                </div>
                
                <div style="margin-bottom: 15px;">
                    <label for="tipo_cuenta" style="display: block; margin-bottom: 5px;">¿Qué harás en la plataforma?</label>
                    <select name="tipo_cuenta" id="tipo_cuenta" required style="width: 100%; padding: 8px;">
                        <option value="CLIENTE">Soy Cliente (Comprar)</option>
                        <option value="TIENDA">Soy Emprendedor (Vender)</option>
                    </select>
                </div>
                
                <button type="submit" style="width: 100%; padding: 10px; background-color: #28a745; color: white; border: none; cursor: pointer;">Crear Cuenta</button>
            </form>
        </div>
        
    </div>
</div>

<!-- ========================================== -->
<!-- SCRIPT PARA CONTROLAR EL MODAL             -->
<!-- ========================================== -->
<script>
    const modal = document.getElementById('modalAuth');
    const vistaLogin = document.getElementById('vista-login');
    const vistaRegistro = document.getElementById('vista-registro');

    // Función para mostrar el modal flotante
    function abrirModal() {
        modal.style.display = 'block';
    }

    // Función para ocultar el modal flotante
    function cerrarModal() {
        modal.style.display = 'none';
    }

    // Función para alternar entre los formularios de Login y Registro
    function cambiarPestana(pestana) {
        if (pestana === 'registro') {
            vistaLogin.style.display = 'none';
            vistaRegistro.style.display = 'block';
        } else {
            vistaLogin.style.display = 'block';
            vistaRegistro.style.display = 'none';
        }
    }

    // Cierra el modal si el usuario hace clic fuera de la caja blanca
    window.onclick = function(event) {
        if (event.target === modal) {
            cerrarModal();
        }
    }
</script>

{% endblock %}
