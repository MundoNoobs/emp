{% extends 'pages/base.html' %} <!-- Extiende de tu base actual -->

{% block content %}
<div class="container mt-5">
    <h2>Registro de Nuevo Usuario</h2>
    
    <!-- Mostrar mensajes de error (como contraseñas que no coinciden) -->
    {% if form.errors %}
        <div class="alert alert-danger">
            Por favor, corrige los errores indicados abajo.
        </div>
    {% endif %}

    <!-- El formulario que envía los datos mediante método POST a la vista de Django -->
    <form method="POST" action="{% url 'registro' %}">
        {% csrf_token %} <!-- Medida de seguridad obligatoria en Django -->
        
        {{ form.as_p }} <!-- Renderiza los campos del forms.py en formato de párrafo -->
        
        <button type="submit" class="btn btn-primary">Crear Cuenta</button>
    </form>
</div>
{% endblock %}
